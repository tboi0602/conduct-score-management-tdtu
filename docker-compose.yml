name: barcode-attendance-system

# Shared config for every API producer instance. Add instances with
# `docker compose up -d --scale`-style blocks or duplicate the service;
# Nginx upstream must list each container name.
x-api-base: &api-base
  image: attendance-api:latest
  restart: unless-stopped
  env_file:
    - .env
  environment:
    NODE_ENV: production
    PORT: ${API_PORT}
  depends_on:
    db-migrate:
      condition: service_completed_successfully
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://localhost:'+process.env.PORT+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 10s
    timeout: 5s
    retries: 5
  networks:
    - attendance-net

services:
  # ============================================================
  # PostgreSQL - Primary datastore.
  # Schema is owned by Prisma migrations (db-migrate service below);
  # init.sql only applies runtime tuning, no tables.
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: attendance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - attendance-net

  # ============================================================
  # One-shot schema migration before any API/worker starts.
  # ============================================================
  db-migrate:
    image: attendance-api:latest
    container_name: attendance-db-migrate
    restart: "no"
    env_file:
      - .env
    command: ["sh", "-c", "npx prisma migrate deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - attendance-net

  # ============================================================
  # Redis - Idempotency locks, dynamic rate limits, cache, SSE
  # pub/sub. Password enforced; AOF for lock durability.
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: attendance-redis
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - attendance-net

  # ============================================================
  # RabbitMQ - Event-driven backbone with management UI.
  # Topology (queues, DLX, retry queues) is asserted by the app on
  # boot - see server/src/config/rabbitmq.ts.
  # ============================================================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: attendance-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit consumer_timeout 1800000"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 6
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    networks:
      - attendance-net

  # ============================================================
  # Client - Next.js UI. Nginx proxies to this container directly.
  # ============================================================
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: runner
    image: attendance-client:latest
    container_name: attendance-client
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    networks:
      - attendance-net

  # ============================================================
  # Nginx - Reverse proxy, load balancer, rate limiter, TLS
  # termination (self-signed dev cert in docker/nginx/certs).
  # ============================================================
  nginx:
    build:
      context: ./docker/nginx
    container_name: attendance-nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      client:
        condition: service_started
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_TLS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/snippets:/etc/nginx/snippets:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    networks:
      - attendance-net

  # ============================================================
  # API Producer fleet - Express REST API, publishes events to
  # RabbitMQ. Nginx load-balances across the instances below.
  # ============================================================
  api:
    <<: *api-base
    build:
      context: ./server
      dockerfile: Dockerfile
      target: api
    container_name: attendance-api-1

  api-2:
    <<: *api-base
    container_name: attendance-api-2

  # ============================================================
  # Worker Consumer - Consumes attendance events, applies
  # geofencing + rule engine, persists to Postgres. Exposes a
  # health/metrics endpoint on WORKER_HEALTH_PORT.
  # ============================================================
  worker:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: worker
    image: attendance-worker:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      WORKER_HEALTH_PORT: ${WORKER_HEALTH_PORT:-9101}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:'+(process.env.WORKER_HEALTH_PORT||9101)+'/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - attendance-net

  # ============================================================
  # Observability: Prometheus scrapes /metrics from api, api-2 and
  # worker; Grafana (http://localhost:${GRAFANA_PORT}) ships with
  # the datasource pre-provisioned.
  # ============================================================
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: attendance-prometheus
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - attendance-net

  grafana:
    image: grafana/grafana:11.1.0
    container_name: attendance-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    networks:
      - attendance-net

networks:
  attendance-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
