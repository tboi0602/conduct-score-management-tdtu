name: training-point-management-system

# Config chung cho mọi instance API producer. Muốn thêm instance thì
# nhân bản service kiểu này hoặc dùng --scale; upstream Nginx phải liệt
# kê tên container tương ứng.
x-api-base: &api-base
  image: training-point-api:latest
  restart: unless-stopped
  env_file:
    - .env.docker
  environment:
    NODE_ENV: production
    PORT: ${API_PORT}
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672${RABBITMQ_VHOST:-/}
  depends_on:
    db-migrate:
      condition: service_completed_successfully
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://localhost:'+process.env.PORT+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 10s
    timeout: 5s
    retries: 5
  networks:
    - training-point-net

services:
  # ============================================================
  # PostgreSQL - kho dữ liệu chính.
  # Schema thuộc về Prisma migrations (service db-migrate bên dưới);
  # init.sql chỉ cấu hình runtime, không tạo bảng.
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: training-point-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks:
      - training-point-net

  # ============================================================
  # Service chạy migration schema một lần trước khi API/worker start.
  # ============================================================
  db-migrate:
    image: training-point-api:latest
    container_name: training-point-db-migrate
    restart: "no"
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    command: ["sh", "-c", "npx prisma migrate deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - training-point-net

  # ============================================================
  # Redis - khóa idempotency, rate limit động, cache, pub/sub cho SSE.
  # Chỉ bind vào localhost để server chạy local có thể kết nối an toàn.
  # Bắt buộc mật khẩu; bật AOF để khóa SETNX không mất khi restart.
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: training-point-redis
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    networks:
      - training-point-net

  # ============================================================
  # RabbitMQ - xương sống event-driven, có management UI.
  # Topology (queue, DLX, retry queue) được app assert khi khởi động -
  # xem server/src/config/rabbitmq.ts.
  # ============================================================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: training-point-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit consumer_timeout 1800000"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 6
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MGMT_PORT:-15672}:15672"
    networks:
      - training-point-net

  # ============================================================
  # Client - giao diện Next.js. Nginx proxy thẳng vào container này.
  # ============================================================
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: runner
    image: training-point-client:latest
    container_name: training-point-client
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    networks:
      - training-point-net

  # ============================================================
  # Nginx - reverse proxy, load balancer, rate limiter, TLS
  # termination (cert self-signed cho dev nằm ở docker/nginx/certs).
  # ============================================================
  nginx:
    build:
      context: ./docker/nginx
    container_name: training-point-nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      client:
        condition: service_started
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_TLS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/snippets:/etc/nginx/snippets:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    networks:
      - training-point-net

  # ============================================================
  # Fleet API Producer - Express REST API, publish event sang RabbitMQ.
  # Nginx load-balance giữa các instance bên dưới.
  # ============================================================
  api:
    <<: *api-base
    build:
      context: ./server
      dockerfile: Dockerfile
      target: api
    container_name: training-point-api-1

  api-2:
    <<: *api-base
    container_name: training-point-api-2

  # ============================================================
  # Worker Consumer - tiêu thụ event điểm danh, chạy geofencing +
  # rule engine, ghi vào Postgres. Expose health/metrics trên
  # WORKER_HEALTH_PORT.
  # ============================================================
  worker:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: worker
    image: training-point-worker:latest
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      WORKER_HEALTH_PORT: ${WORKER_HEALTH_PORT:-9101}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:'+(process.env.WORKER_HEALTH_PORT||9101)+'/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - training-point-net

  # ============================================================
  # Quan sát: Prometheus scrape /metrics từ api, api-2 và worker;
  # Grafana (http://localhost:${GRAFANA_PORT}) có sẵn datasource
  # được provision từ đầu.
  # ============================================================
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: training-point-prometheus
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - training-point-net

  grafana:
    image: grafana/grafana:11.1.0
    container_name: training-point-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    networks:
      - training-point-net

networks:
  training-point-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
