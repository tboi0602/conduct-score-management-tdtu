global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrape trực tiếp qua mạng nội bộ Docker (không đi qua Nginx).
  - job_name: training-point-api
    static_configs:
      - targets: ["api:3000", "api-2:3000"]

  - job_name: training-point-worker
    static_configs:
      - targets: ["worker:9101"]
