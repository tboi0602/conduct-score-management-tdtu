worker_processes auto;

events {
    worker_connections 8192;
    multi_accept on;
    use epoll;
}

http {
    server_tokens off;
    log_format main '$remote_addr [$time_local] "$request" $status '
                    'upstream:$upstream_addr rt:$request_time request_id:$request_id '
                    'client_attempt:$http_x_client_attempt_id scanner:$http_x_scanner_id';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65s;
    keepalive_requests 10000;
    client_max_body_size 1m;

    # Chỉ dùng trong topology kiểm thử cô lập. Mức này tránh biến giới hạn theo
    # một IP của k6 thành nút thắt giả nhưng vẫn giữ nguyên đường đi qua Nginx.
    limit_req_zone $binary_remote_addr zone=global_ip:10m rate=3000r/s;
    limit_req_zone $binary_remote_addr zone=scan_attempt:10m rate=3000r/s;
    limit_conn_zone $binary_remote_addr zone=per_ip_conn:10m;
    limit_req_status 429;
    limit_conn_status 429;

    upstream conduct_score_api {
        least_conn;
        server api:3000 max_fails=3 fail_timeout=10s;
        server api-2:3000 max_fails=3 fail_timeout=10s;
        keepalive 128;
    }
    upstream conduct_score_client {
        server client:3000;
        keepalive 32;
    }
    server {
        listen 80;
        server_name _;
        include /etc/nginx/snippets/attendance-locations.conf;
    }
}
