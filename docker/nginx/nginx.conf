worker_processes auto;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    # ------------------------------------------------------------
    # Core tuning
    # ------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'upstream:$upstream_addr rt:$request_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65s;
    keepalive_requests 1000;
    client_body_timeout 10s;
    client_header_timeout 10s;
    reset_timedout_connection on;

    # Max 1MB request body (barcode payloads are tiny).
    client_max_body_size 1m;

    # ------------------------------------------------------------
    # Rate limiting zones
    # zone name | shared-mem size | default burst-per-sec limit
    # ------------------------------------------------------------
    limit_req_zone  $binary_remote_addr zone=global_ip:10m rate=10r/s;
    limit_req_zone  $binary_remote_addr zone=scan_attempt:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=per_ip_conn:10m;

    # ------------------------------------------------------------
    # Upstream API producer fleet (load balancing, least-conn)
    # ------------------------------------------------------------
    upstream attendance_api {
        # Optional hash-consistent routing per student id header.
        # hash $http_x_student_id consistent;

        least_conn;
        server api:3000 max_fails=3 fail_timeout=10s weight=3;
        server api-2:3000 max_fails=3 fail_timeout=10s weight=3;

        keepalive 64;
    }

    upstream attendance_client {
        server client:3000;
        keepalive 32;
    }

    # ------------------------------------------------------------
    # HTTP - kept for local/dev traffic and ACME challenges.
    # ------------------------------------------------------------
    server {
        listen 80;
        server_name _;
        include /etc/nginx/snippets/attendance-locations.conf;
    }

    # ------------------------------------------------------------
    # HTTPS - self-signed dev cert (docker/nginx/certs). Replace
    # with a real certificate (e.g. Let's Encrypt) in production.
    # ------------------------------------------------------------
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        include /etc/nginx/snippets/attendance-locations.conf;
    }
}
