worker_processes auto;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    server_tokens off;
    # ------------------------------------------------------------
    # Tinh chỉnh cơ bản
    # ------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'upstream:$upstream_addr rt:$request_time '
                    'request_id:$request_id client_attempt:$http_x_client_attempt_id';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65s;
    keepalive_requests 1000;
    client_body_timeout 10s;
    client_header_timeout 10s;
    reset_timedout_connection on;

    # Compress regular text and JSON responses. SSE locations disable this so
    # each event can be flushed immediately.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/manifest+json
               application/xml image/svg+xml text/css text/plain text/xml;

    # Body tối đa 1MB (payload quét mã rất nhỏ).
    client_max_body_size 1m;

    # ------------------------------------------------------------
    # Các zone rate limit
    # tên zone | dung lượng shared-mem | giới hạn mỗi giây
    # ------------------------------------------------------------
    limit_req_zone  $binary_remote_addr zone=global_ip:10m rate=10r/s;
    limit_req_zone  $binary_remote_addr zone=scan_attempt:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=per_ip_conn:10m;
    limit_req_status 429;
    limit_conn_status 429;

    # ------------------------------------------------------------
    # Upstream fleet API producer (load balancing, least-conn)
    # ------------------------------------------------------------
    upstream conduct_score_api {
        # Tùy chọn: routing hash theo header id sinh viên.
        # hash $http_x_student_id consistent;

        least_conn;
        server api:3000 max_fails=3 fail_timeout=10s weight=3;
        server api-2:3000 max_fails=3 fail_timeout=10s weight=3;

        keepalive 64;
    }

    upstream conduct_score_client {
        server client:3000;
        keepalive 32;
    }

    # ------------------------------------------------------------
    # HTTP - giữ lại cho traffic local/dev và ACME challenge.
    # ------------------------------------------------------------
    server {
        listen 80;
        server_name _;
        include /etc/nginx/snippets/attendance-locations.conf;
    }

    # ------------------------------------------------------------
    # HTTPS - cert self-signed cho dev (docker/nginx/certs).
    # Thay bằng cert thật (vd Let's Encrypt) khi lên production.
    # ------------------------------------------------------------
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        include /etc/nginx/snippets/attendance-locations.conf;
    }
}
