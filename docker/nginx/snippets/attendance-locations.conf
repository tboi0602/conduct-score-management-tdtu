# Shared server-level directives + locations for the HTTP and HTTPS
# virtual hosts. Included from nginx.conf.

# ---- Global protection ----
# Refuse requests that breach the 10 req/s ceiling (burst 20).
limit_req zone=global_ip burst=20 nodelay;
limit_conn per_ip_conn 50;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;

# ---- Barcode scan endpoint: stricter dedicated zone ----
location = /api/v1/attendance/scan {
    limit_req zone=scan_attempt burst=10 nodelay;

    proxy_pass http://attendance_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Abort slow-upstream requests to free workers.
    proxy_connect_timeout 2s;
    proxy_send_timeout    5s;
    proxy_read_timeout   10s;
}

# ---- General API ----
location /api/ {
    proxy_pass http://attendance_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 2s;
    proxy_send_timeout    10s;
    proxy_read_timeout   30s;
}

# ---- Long-poll / SSE recommendations (Redis Pub/Sub fan-out) ----
location ~ ^/api/v1/recommendations/stream {
    proxy_pass http://attendance_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
}

# ---- Static Next.js client ----
location / {
    proxy_pass http://attendance_client;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Cache immutable static assets aggressively.
    location ~* \.(?:js|css|png|jpg|jpeg|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        proxy_pass http://attendance_client;
    }
}

# ---- Health check (not rate limited) ----
location = /health {
    access_log off;
    proxy_pass http://attendance_api;
    proxy_connect_timeout 1s;
    proxy_read_timeout   2s;
}
