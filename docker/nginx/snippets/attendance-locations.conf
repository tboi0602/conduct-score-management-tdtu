# Các directive cấp server + location dùng chung cho HTTP và HTTPS.
# Được include từ nginx.conf.

# ---- Bảo vệ toàn cục ----
# Từ chối request vượt trần 10 req/s (cho burst 20).
limit_req zone=global_ip burst=20 nodelay;
limit_conn per_ip_conn 50;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;

# ---- Endpoint quét mã vạch: zone riêng nghiêm ngặt hơn ----
location = /api/v1/attendance/scan {
    limit_req zone=scan_attempt burst=10 nodelay;

    proxy_pass http://training_point_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Hủy request chậm để giải phóng worker.
    proxy_connect_timeout 2s;
    proxy_send_timeout    5s;
    proxy_read_timeout   10s;
}

# ---- API chung ----
location /api/ {
    proxy_pass http://training_point_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 2s;
    proxy_send_timeout    10s;
    proxy_read_timeout   30s;
}

# ---- Luồng dài / SSE gợi ý (fan-out qua Redis Pub/Sub) ----
location ~ ^/api/v1/recommendations/stream {
    proxy_pass http://training_point_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
}

# ---- Client tĩnh Next.js ----
location / {
    proxy_pass http://training_point_client;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Cache tài sản tĩnh bất biến lâu dài.
    location ~* \.(?:js|css|png|jpg|jpeg|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        proxy_pass http://training_point_client;
    }
}

# ---- Health check (không rate limit) ----
location = /health {
    access_log off;
    proxy_pass http://training_point_api;
    proxy_connect_timeout 1s;
    proxy_read_timeout   2s;
}
