# Shared server and location directives for HTTP and HTTPS.

# Edge load protection. Application-level Redis rate limits still apply after
# these per-IP limits.
limit_conn per_ip_conn 50;

# Headers that are safe for both the Next.js application and Google Sign-In.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

# Student QR and managed barcode/manual scan endpoints. They have a tighter
# edge limit and short timeouts because the API accepts work asynchronously.
location ~ ^/api/v1/attendance/(?:scan/qr|events/[^/]+/scan)$ {
    limit_req zone=scan_attempt burst=10 nodelay;

    proxy_pass http://conduct_score_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Client-Attempt-ID $http_x_client_attempt_id;
    proxy_socket_keepalive on;

    proxy_connect_timeout 2s;
    proxy_send_timeout 5s;
    proxy_read_timeout 10s;
}

# Attendance realtime stream. Buffering, caching and compression would delay
# SSE delivery, so they are explicitly disabled here.
location = /api/v1/attendance/stream {
    limit_req zone=global_ip burst=20 nodelay;

    proxy_pass http://conduct_score_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_socket_keepalive on;

    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_connect_timeout 2s;
    proxy_send_timeout 30s;
    proxy_read_timeout 3600s;
}

# Existing recommendation realtime stream.
location ~ ^/api/v1/recommendations/stream {
    limit_req zone=global_ip burst=20 nodelay;

    proxy_pass http://conduct_score_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_socket_keepalive on;

    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_connect_timeout 2s;
    proxy_send_timeout 30s;
    proxy_read_timeout 3600s;
}

# Prometheus scrapes API instances through the private Docker network.
location = /metrics {
    access_log off;
    return 404;
}

# Regular API traffic.
location /api/ {
    limit_req zone=global_ip burst=20 nodelay;

    proxy_pass http://conduct_score_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Client-Attempt-ID $http_x_client_attempt_id;
    proxy_socket_keepalive on;

    proxy_connect_timeout 2s;
    proxy_send_timeout 10s;
    proxy_read_timeout 30s;
}

# Next.js application and long-lived immutable assets.
location / {
    proxy_pass http://conduct_score_client;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_socket_keepalive on;

    location ~* \.(?:js|css|png|jpg|jpeg|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
        proxy_pass http://conduct_score_client;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_socket_keepalive on;
    }
}

# Health endpoint is deliberately exempt from request limiting so Docker can
# assess API availability even while public clients are being throttled.
location = /health {
    access_log off;
    proxy_pass http://conduct_score_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_socket_keepalive on;
    proxy_connect_timeout 1s;
    proxy_read_timeout 2s;
}
