# Basic persistent-ish runtime config (AOF is enabled via docker run args).
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300
databases 16

# Persistence: AOF (more durable than RDB for SETNX lock integrity).
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes

# Memory management.
maxmemory 256mb
maxmemory-policy allkeys-lru

# Connection limits.
maxclients 10000