<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sơ đồ RDM - Mũi tên Tham chiếu Khóa Ngoại</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; }
        body { background-color: #0b1120; color: #f8fafc; padding: 20px; display: flex; flex-direction: column; align-items: center; }

        .header { width: 100%; max-width: 1200px; margin-bottom: 15px; border-bottom: 1px solid #1e293b; padding-bottom: 10px; }
        .header h1 { font-size: 18px; color: #38bdf8; text-transform: uppercase; letter-spacing: 1px; }
        .header p { font-size: 12px; color: #64748b; margin-top: 4px; }

        .diagram-wrapper {
            width: 100%;
            max-width: 1200px;
            overflow-x: auto;
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        svg { width: 1180px; height: 760px; display: block; }

        /* Table Card Styling */
        .table-box { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 6px; }
        .table-header { fill: #0f172a; stroke: #334155; stroke-width: 1.5; }
        .table-title { fill: #38bdf8; font-size: 12px; font-weight: bold; }
        .field-text { fill: #cbd5e1; font-size: 11px; }
        
        /* Key Highlighting */
        .pk-text { fill: #facc15; font-weight: bold; text-decoration: underline; }
        .fk-text { fill: #38bdf8; font-weight: bold; }

        /* Relation Lines */
        .rel-line { fill: none; stroke-width: 1.8; stroke-dasharray: 4, 2; transition: all 0.3s; }
        .rel-line:hover { stroke-width: 3; stroke-dasharray: none; cursor: pointer; }
        
        /* Colors for different FK connections */
        .arrow-class { stroke: #e11d48; }
        .arrow-sem { stroke: #10b981; }
        .arrow-crit { stroke: #f59e0b; }
        .arrow-student { stroke: #8b5cf6; }
        .arrow-event { stroke: #06b6d4; }
        .arrow-att { stroke: #ec4899; }

        .legend {
            display: flex; gap: 20px; font-size: 12px; margin-top: 15px; background: #1e293b; padding: 8px 16px; border-radius: 6px;
        }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Sơ đồ Mô hình Quan hệ RDM (Trực quan hóa Mũi tên Tham chiếu)</h1>
        <p>Mũi tên xuất phát từ Khóa Ngoại (FK - Màu Xanh) trỏ trực tiếp vào Khóa Chính (_id - Màu Vàng) của bảng được tham chiếu.</p>
    </div>

    <div class="diagram-wrapper">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760">
            
            <!-- DEFINITIONS FOR ARROWHEADS -->
            <defs>
                <marker id="arrow-class" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#e11d48" />
                </marker>
                <marker id="arrow-sem" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981" />
                </marker>
                <marker id="arrow-crit" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b" />
                </marker>
                <marker id="arrow-student" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b5cf6" />
                </marker>
                <marker id="arrow-event" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#06b6d4" />
                </marker>
                <marker id="arrow-att" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#ec4899" />
                </marker>
            </defs>

            <!-- ================= BẢNG DỮ LIỆU (NODES) ================= -->

            <!-- 1. CLASSES (X: 30, Y: 40) -->
            <g transform="translate(30, 40)">
                <rect class="table-box" width="220" height="130" />
                <rect class="table-header" width="220" height="30" rx="6" />
                <text x="12" y="20" class="table-title">1. classes</text>
                <text x="12" y="50" class="pk-text">_id (PK)</text>
                <text x="12" y="70" class="field-text">class_code</text>
                <text x="12" y="90" class="field-text">class_name</text>
                <text x="12" y="110" class="field-text">faculty_name</text>
            </g>

            <!-- 2. SEMESTERS (X: 30, Y: 220) -->
            <g transform="translate(30, 220)">
                <rect class="table-box" width="220" height="130" />
                <rect class="table-header" width="220" height="30" rx="6" />
                <text x="12" y="20" class="table-title">2. semesters</text>
                <text x="12" y="50" class="pk-text">_id (PK)</text>
                <text x="12" y="70" class="field-text">semester_code</text>
                <text x="12" y="90" class="field-text">name</text>
                <text x="12" y="110" class="field-text">is_active</text>
            </g>

            <!-- 3. DRL_CRITERIA (X: 30, Y: 400) -->
            <g transform="translate(30, 400)">
                <rect class="table-box" width="220" height="130" />
                <rect class="table-header" width="220" height="30" rx="6" />
                <text x="12" y="20" class="table-title">3. drl_criteria</text>
                <text x="12" y="50" class="pk-text">_id (PK)</text>
                <text x="12" y="70" class="fk-text">parent_id (FK)</text>
                <text x="12" y="90" class="field-text">title</text>
                <text x="12" y="110" class="field-text">max_points</text>
            </g>

            <!-- 4. STUDENTS (X: 330, Y: 40) -->
            <g transform="translate(330, 40)">
                <rect class="table-box" width="240" height="170" />
                <rect class="table-header" width="240" height="30" rx="6" />
                <text x="12" y="20" class="table-title">4. students</text>
                <text x="12" y="50" class="pk-text">_id (PK)</text>
                <text x="12" y="70" class="field-text">student_code</text>
                <text x="12" y="90" class="field-text">full_name</text>
                <text x="12" y="110" class="fk-text">class_id (FK)</text>
                <text x="12" y="130" class="field-text">barcode_hash</text>
                <text x="12" y="150" class="field-text">email</text>
            </g>

            <!-- 5. EVENTS (X: 330, Y: 270) -->
            <g transform="translate(330, 270)">
                <rect class="table-box" width="240" height="170" />
                <rect class="table-header" width="240" height="30" rx="6" />
                <text x="12" y="20" class="table-title">5. events</text>
                <text x="12" y="50" class="pk-text">_id (PK)</text>
                <text x="12" y="70" class="field-text">title</text>
                <text x="12" y="90" class="fk-text">semester_id (FK)</text>
                <text x="12" y="110" class="fk-text">drl_criterion_id (FK)</text>
                <text x="12" y="130" class="field-text">reward_points</text>
                <text x="12" y="150" class="field-text">checkin_mode</text>
            </g>

            <!-- 6. ATTENDANCE_RECORDS (X: 660, Y: 40) -->
            <g transform="translate(660, 40)">
                <rect class="table-box" width="240" height="170" />
                <rect class="table-header" width="240" height="30" rx="6" />
                <text x="12" y="20" class="table-title">6. attendance_records</text>
                <text x="12" y="50" class="pk-text">_id (PK)</text>
                <text x="12" y="70" class="fk-text">event_id (FK)</text>
                <text x="12" y="90" class="fk-text">student_id (FK)</text>
                <text x="12" y="110" class="field-text">checkin_at</text>
                <text x="12" y="130" class="field-text">checkout_at</text>
                <text x="12" y="150" class="field-text">status</text>
            </g>

            <!-- 7. DRL_SCORE_DETAILS (X: 660, Y: 270) -->
            <g transform="translate(660, 270)">
                <rect class="table-box" width="260" height="230" />
                <rect class="table-header" width="260" height="30" rx="6" />
                <text x="12" y="20" class="table-title">7. drl_score_details</text>
                <text x="12" y="50" class="pk-text">_id (PK)</text>
                <text x="12" y="70" class="fk-text">student_id (FK)</text>
                <text x="12" y="90" class="fk-text">semester_id (FK)</text>
                <text x="12" y="110" class="fk-text">drl_criterion_id (FK)</text>
                <text x="12" y="130" class="fk-text">attendance_record_id (FK)</text>
                <text x="12" y="150" class="field-text">points</text>
                <text x="12" y="170" class="field-text">source_type</text>
                <text x="12" y="190" class="field-text">proof_url</text>
                <text x="12" y="210" class="field-text">status</text>
            </g>

            <!-- 8. DRL_EVALUATIONS (X: 330, Y: 500) -->
            <g transform="translate(330, 500)">
                <rect class="table-box" width="240" height="210" />
                <rect class="table-header" width="240" height="30" rx="6" />
                <text x="12" y="20" class="table-title">8. drl_evaluations</text>
                <text x="12" y="50" class="pk-text">_id (PK)</text>
                <text x="12" y="70" class="fk-text">student_id (FK)</text>
                <text x="12" y="90" class="fk-text">semester_id (FK)</text>
                <text x="12" y="110" class="field-text">self_score</text>
                <text x="12" y="130" class="field-text">system_score</text>
                <text x="12" y="150" class="field-text">final_score</text>
                <text x="12" y="170" class="field-text">ranking</text>
                <text x="12" y="190" class="field-text">status</text>
            </g>


            <!-- ================= MŨI TÊN CÁC THAM CHIẾU (PATHS) ================= -->

            <!-- 1. FK students.class_id -> PK classes._id -->
            <path class="rel-line arrow-class" marker-end="url(#arrow-class)"
                  d="M 330 150 C 290 150, 290 90, 250 90" />

            <!-- 2. FK events.semester_id -> PK semesters._id -->
            <path class="rel-line arrow-sem" marker-end="url(#arrow-sem)"
                  d="M 330 360 C 290 360, 290 270, 250 270" />

            <!-- 3. FK events.drl_criterion_id -> PK drl_criteria._id -->
            <path class="rel-line arrow-crit" marker-end="url(#arrow-crit)"
                  d="M 330 380 C 280 380, 280 450, 250 450" />

            <!-- 4. FK drl_criteria.parent_id -> PK drl_criteria._id (Tự tham chiếu) -->
            <path class="rel-line arrow-crit" marker-end="url(#arrow-crit)"
                  d="M 30 470 C -10 470, -10 450, 30 450" />

            <!-- 5. FK attendance_records.event_id -> PK events._id -->
            <path class="rel-line arrow-event" marker-end="url(#arrow-event)"
                  d="M 660 110 C 600 110, 600 320, 570 320" />

            <!-- 6. FK attendance_records.student_id -> PK students._id -->
            <path class="rel-line arrow-student" marker-end="url(#arrow-student)"
                  d="M 660 130 C 610 130, 610 90, 570 90" />

            <!-- 7. FK drl_score_details.student_id -> PK students._id -->
            <path class="rel-line arrow-student" marker-end="url(#arrow-student)"
                  d="M 660 340 C 600 340, 600 90, 570 90" />

            <!-- 8. FK drl_score_details.semester_id -> PK semesters._id -->
            <path class="rel-line arrow-sem" marker-end="url(#arrow-sem)"
                  d="M 660 360 C 200 360, 200 270, 250 270" />

            <!-- 9. FK drl_score_details.drl_criterion_id -> PK drl_criteria._id -->
            <path class="rel-line arrow-crit" marker-end="url(#arrow-crit)"
                  d="M 660 380 C 200 380, 200 450, 250 450" />

            <!-- 10. FK drl_score_details.attendance_record_id -> PK attendance_records._id -->
            <path class="rel-line arrow-att" marker-end="url(#arrow-att)"
                  d="M 660 400 C 610 400, 610 90, 900 90" />

            <!-- 11. FK drl_evaluations.student_id -> PK students._id -->
            <path class="rel-line arrow-student" marker-end="url(#arrow-student)"
                  d="M 330 570 C 300 570, 300 90, 570 90" />

            <!-- 12. FK drl_evaluations.semester_id -> PK semesters._id -->
            <path class="rel-line arrow-sem" marker-end="url(#arrow-sem)"
                  d="M 330 590 C 270 590, 270 270, 250 270" />

        </svg>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="dot" style="background: #e11d48"></span> Liên kết Lớp</div>
        <div class="legend-item"><span class="dot" style="background: #8b5cf6"></span> Liên kết Sinh viên</div>
        <div class="legend-item"><span class="dot" style="background: #10b981"></span> Liên kết Học kỳ</div>
        <div class="legend-item"><span class="dot" style="background: #f59e0b"></span> Liên kết Tiêu chí ĐRL</div>
        <div class="legend-item"><span class="dot" style="background: #06b6d4"></span> Liên kết Sự kiện</div>
        <div class="legend-item"><span class="dot" style="background: #ec4899"></span> Liên kết Điểm danh</div>
    </div>

</body>
</html>
